<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BrightPath Help</title>
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec; --ink: #1b1d1c; --muted: #5f6461; --line: #e2e3de;
    --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #e5f1ed;
    --warn: #8a5300; --warn-soft: #fbf1e0; --warn-line: #efd8b0;
    --err: #b42318; --err-soft: #fdecea; --err-line: #f4c7c1;
    --mark: #fff1b8; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121413; --surface: #1b1e1d; --surface-2: #232726; --ink: #eceeed; --muted: #a2a8a5; --line: #2e3331;
      --accent: #4fb89a; --accent-ink: #0d1f1a; --accent-soft: #1d332d;
      --warn: #f0b85c; --warn-soft: #2e2617; --warn-line: #4a3b1f;
      --err: #f08a80; --err-soft: #331d1b; --err-line: #55302c;
      --mark: #5a4b12; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 16px; }

  header { display: flex; align-items: center; gap: 12px; padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
  header h1 { font-size: 17px; margin: 0; line-height: 1.2; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  main { flex: 1; padding: 24px 0 8px; }
  .intro h2 { font-size: 24px; letter-spacing: -.01em; margin: 8px 0 6px; }
  .intro p { color: var(--muted); margin: 0 0 20px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); }

  .thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .q { align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: var(--radius) var(--radius) 4px var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { align-self: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 4px var(--radius) var(--radius) var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .a.not_found { background: var(--warn-soft); border-color: var(--warn-line); }
  .a.error { background: var(--err-soft); border-color: var(--err-line); }
  .label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .not_found .label { color: var(--warn); }
  .error .label { color: var(--err); }
  .invalid .label { color: var(--muted); }
  .label svg { width: 14px; height: 14px; }
  .a .text { overflow-wrap: anywhere; }
  .a a { color: inherit; }
  .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .src { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .src:hover { border-color: var(--accent); }
  .actions { margin-top: 10px; }
  .btn-ghost { border: 1px solid currentColor; background: transparent; color: var(--err); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 14px; }
  .dots { display: inline-flex; gap: 3px; margin-right: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }

  .composer { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg) 18px); padding: 18px 0 calc(16px + env(safe-area-inset-bottom)); }
  form { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); }
  form:focus-within { border-color: var(--accent); }
  textarea:focus-visible { outline: none; }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; padding: 8px 0; max-height: 160px; min-height: 24px; line-height: 1.5; }
  .send { flex: none; height: 40px; min-width: 40px; padding: 0 16px; border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
  @media (hover: none) { .kbd { display: none; } }
  .count.over { color: var(--err); font-weight: 600; }

  dialog { width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 640px); border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
  .dlg-head h3 { margin: 0; font-size: 16px; }
  .close { border: 0; background: var(--surface-2); color: var(--ink); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; cursor: pointer; flex: none; }
  .doc { padding: 12px 16px 18px; }
  .doc p { margin: 0; padding: 6px 8px; border-radius: 6px; }
  .doc p.hit { background: var(--mark); }
  .doc .legend { font-size: 12px; color: var(--muted); margin: 0 0 6px; padding: 0 8px; }
  @media (max-width: 560px) {
    dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 16px 16px 0 0; max-height: 85vh; }
    .intro h2 { font-size: 21px; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">B</div>
    <div>
      <h1>BrightPath Learn Help</h1>
      <p>Answers come only from BrightPath's help documents</p>
    </div>
  </header>

  <main>
    <section class="intro" id="intro">
      <h2>How can we help?</h2>
      <p>Ask about lessons, coaching, feedback or your account. Every answer shows the document it came from.</p>
      <div class="suggest" id="suggest">
        <button class="chip" type="button">When is group coaching?</button>
        <button class="chip" type="button">Does watching a video mark my lesson complete?</button>
        <button class="chip" type="button">How long does feedback on practice work take?</button>
        <button class="chip" type="button">I forgot my password</button>
      </div>
    </section>
    <ol class="thread" id="thread" aria-live="polite" aria-label="Conversation"></ol>
  </main>

  <div class="composer">
    <form id="form">
      <label for="q" class="sr-only">Your question</label>
      <textarea id="q" rows="1" maxlength="600" placeholder="Type your question" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" disabled>Ask</button>
    </form>
    <div class="hint"><span><span class="kbd">Enter to send, Shift+Enter for a new line. </span>Never share your password.</span><span class="count" id="count"></span></div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><h3 id="dlg-title"></h3><button class="close" id="dlg-close" type="button" aria-label="Close">×</button></div>
  <div class="doc" id="dlg-body"></div>
</dialog>

<script>
(() => {
  const MAX = 500;
  const $ = (id) => document.getElementById(id);
  const form = $('form'), input = $('q'), send = $('send'), thread = $('thread'), intro = $('intro'), count = $('count');
  const dlg = $('dlg'), dlgTitle = $('dlg-title'), dlgBody = $('dlg-body');
  let busy = false;
  // The three source documents are small and public: load them once with the page
  // so "view source" opens instantly.
  const documentsReady = fetch('/api/documents').then((r) => r.json()).catch(() => null);
  // Same pattern the server uses: a typed password is masked in the conversation.
  const SECRET = /\b(password|passcode|passwd|pwd|pin)(\s*(?:is|was|=|:)\s*)(\S+)/gi;
  const mask = (s) => s.replace(SECRET, (_, k, sep) => k + sep + '••••••');

  const ICONS = {
    answered: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3 3 7-7"/></svg>',
    not_found: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
    invalid: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/></svg>',
    error: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.5h.01"/></svg>',
  };
  const LABELS = { answered: 'From the help documents', not_found: 'Not in the help documents', invalid: 'Please check your question', error: 'Help desk unavailable' };

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const norm = (s) => s.replace(/\s+/g, ' ').replace(/[‘’]/g, "'").replace(/[–—]/g, '-').trim().toLowerCase();

  function update() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    const n = input.value.trim().length;
    count.textContent = n > MAX - 100 ? `${n}/${MAX}` : '';
    count.classList.toggle('over', n > MAX);
    send.disabled = busy || n === 0 || n > MAX;
  }

  // Turns support@... in plain text into a mailto link, everything else stays text.
  function richText(text) {
    const frag = document.createDocumentFragment();
    text.split(/(\b[\w.+-]+@[\w-]+\.[\w.]+\b)/).forEach((part, i) => {
      if (i % 2) { const a = el('a', '', part); a.href = 'mailto:' + part; frag.append(a); }
      else frag.append(part);
    });
    return frag;
  }

  function answerCard(r, question) {
    const li = el('li', 'a ' + r.status);
    const label = el('div', 'label');
    label.innerHTML = ICONS[r.status] || '';
    label.append(LABELS[r.status] || '');
    const text = el('div', 'text');
    text.append(richText(r.answer));
    li.append(label, text);

    if (r.sources && r.sources.length) {
      const s = el('div', 'sources', 'Source:');
      r.sources.forEach((src) => {
        const b = el('button', 'src', src.title.replace(/^Document \d+\s*[—-]\s*/, ''));
        b.type = 'button';
        b.title = 'Show where this answer comes from';
        b.addEventListener('click', () => openDoc(src.id, r.quotes));
        s.append(b);
      });
      li.append(s);
    }
    if (r.status === 'error') {
      const row = el('div', 'actions');
      const retry = el('button', 'btn-ghost', 'Try again');
      retry.type = 'button';
      retry.addEventListener('click', () => { li.remove(); askQuestion(question, true); });
      row.append(retry);
      li.append(row);
    }
    return li;
  }

  async function askQuestion(question, isRetry = false) {
    if (busy) return;
    busy = true; update();
    intro.hidden = true;
    if (!isRetry) thread.append(el('li', 'q', mask(question)));
    const wait = el('li', 'a');
    wait.setAttribute('aria-busy', 'true');
    const t = el('span', 'typing');
    t.innerHTML = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
    t.append('Checking the help documents…');
    wait.append(t);
    thread.append(wait);
    wait.scrollIntoView({ block: 'end', behavior: 'smooth' });

    let r;
    try {
      const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }) });
      r = await res.json();
      if (!r || typeof r.answer !== 'string') throw new Error('bad reply');
    } catch {
      r = { status: 'error', answer: "Can't reach the help desk. Check your connection and try again.", sources: [], quotes: [] };
    }
    const card = answerCard(r, question);
    wait.replaceWith(card);
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    busy = false; update();
    input.focus();
  }

  async function openDoc(id, quotes) {
    const documents = await documentsReady;
    const d = documents && documents.find((x) => x.id === id);
    if (!d) return;
    dlgTitle.textContent = d.title;
    dlgBody.replaceChildren();
    const nq = (quotes || []).map(norm);
    dlgBody.append(el('p', 'legend', 'Highlighted lines support the answer.'));
    d.text.split('\n').slice(1).filter((l) => l.trim()).forEach((line) => {
      const nl = norm(line);
      const hit = nq.some((q) => nl.includes(q) || q.includes(nl));
      dlgBody.append(el('p', hit ? 'hit' : '', line));
    });
    dlg.showModal();
    const first = dlgBody.querySelector('.hit');
    if (first) first.scrollIntoView({ block: 'center' });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || q.length > MAX || busy) return;
    input.value = ''; update();
    askQuestion(q);
  });
  input.addEventListener('input', update);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  $('suggest').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip && !busy) askQuestion(chip.textContent);
  });
  $('dlg-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  update();
  input.focus();
})();
</script>
</body>
</html>
